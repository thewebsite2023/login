<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập bằng MiniQuiz Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .header-container h2 {
            text-align: left;
            margin: 0;
        }

        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        #login {
            float: right;
            padding: 10px;
            border-radius: 100px;
            background-color: white;
            color:rgb(13, 0, 255) ;
            border: 2px solid rgb(13, 0, 255);
            cursor: pointer;
        }

        #login:hover {
            border-radius: 100px;
            background-color: rgb(13, 0, 255);
            color: white;
        }

        a {
            color: blue;
            text-decoration: none;
        }

        /* Căn giữa và tạo khoảng cách giữa các khối */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .row {
            width: 100%;
        }

        .col-md-6 {
            padding: 10px;
        }

        .logo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-image: url('https://thewebsite2023.github.io/login/logo.png'); /* Replace with your image path */
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container" id="loginContainer">
            Đăng nhập bằng MiniQuiz Login
            <hr>
            <div class="row">
                <div class="col-md-6">
                <div class="logo"></div>
                <h3>Đăng nhập</h3>
                <h4>để tiếp tục vào <a href="" data-bs-toggle="modal" data-bs-target="#exampleModal">MiniQuiz</a></h4>
                </div>
                <div class="col-md-6">
                    <form id="loginForm">
                        <br>
                            <input type="text" id="username" placeholder="Tên Đăng Nhập" required>
                            <h5 style="color: red;" id="error"></h5>
                            <br>
                            <div>
                            Trước khi sử dụng MiniQuiz, bạn có thể xem <a href="#">chính sách quyền riêng tư</a> và <a href="#">điều khoản dịch vụ</a> của ứng dụng này.
                            </div>
                            <br>
                            <br>
                            <button type="submit" id="login">Tiếp theo</button>
                    </form>
                </div>
            </div>
        </div>

        <script>
            const accounts = [
                { username: '1', password: '1', fullName: 'Thành Nam' }
            ];
        
            document.getElementById('loginForm').addEventListener('submit', function(event) {
                event.preventDefault();
        
                const username = document.getElementById('username').value;
                const account = accounts.find(acc => acc.username === username);
        
                if (account) {
                    document.getElementById('loginContainer').innerHTML = `
            Đăng nhập bằng MiniQuiz Login
            <hr>
            <div class="row">
                <div class="col-md-6">
                <div class="logo"></div>
                <h3>Chào, ${account.fullName}</h3>
                <p>${account.username}</p>
                </div>
                <div class="col-md-6">
                    <form id="passwordForm">
                            <input type='password' id='password' placeholder='Nhập mật khẩu của bạn' required>
                            <h5 style="color: red;" id="error"></h5>
                            <br>
                            <div>
                            Trước khi sử dụng MiniQuiz, bạn có thể xem <a href="#">chính sách quyền riêng tư</a> và <a href="#">điều khoản dịch vụ</a> của ứng dụng này.
                            </div>
                            <br>
                            <br>
                            <button type='button' id="login" onclick='checkPassword("${account.password}")'>Tiếp theo</button>
                    </form>
                </div>
                    `;
                } else {
                    document.getElementById('error').textContent = 'Tên đăng nhập không đúng!';
                }
            });
        
            function checkPassword(correctPassword) {
                const passwordInput = document.getElementById('password').value;
                if (passwordInput === correctPassword) {
                    document.getElementById('loginContainer').innerHTML = `
                                Đăng nhập bằng MiniQuiz Login
            <hr>
            <div class="row">
                <div class="col-md-6">
                <div class="logo"></div>
                <h3>Đăng nhập vào MiniQuiz</h3>
                </div>
                <div class="col-md-6">
                    <form id="passwordForm">
                            <br>
                            <div>
                            Nếu bạn tiếp tục, MiniQuiz Login sẽ chia sẻ tên, địa chỉ email,<br> lựa chọn ưu tiên về ngôn ngữ và ảnh hồ sơ của bạn với MiniQuiz. <br>Hãy xem <a href="#">Chính sách quyền riêng tư</a> và <a href="#">Điều khoản dịch vụ</a> của MiniQuiz.
                            </div>
                            <br>
                            <div>
                            Bạn có thể quản lý tính năng Đăng nhập bằng MiniQuiz Login trong Tài khoản MiniQuiz của mình.    
                            </div>
                            <br>
                            <br>
                            <div class="row">
                            <button class="btn btn-outline-danger" onclick="cancelAgreement()" id="cancelbutton">Hủy</button>   
                        <button class="btn btn-outline-success" onclick="continueAgreement()" id="continuebutton">Tiếp tục</button>
                        </div>
                    </form>
                </div>
                    `;
                } else {
                    document.getElementById('error').textContent = 'Mật khẩu không đúng!';
                }
            }
        
            function cancelAgreement() {
                window.close();
            }
        
            function continueAgreement() {
                window.opener.postMessage('success', window.location.origin);
                window.close();
            }
        </script>   
        <style>
            #cancelbutton {
                width: 50%;
                border-radius: 100px;
            }
            #continuebutton {
                width: 50%;
                border-radius: 100px;
            }
        </style>     
</body>
</html>
