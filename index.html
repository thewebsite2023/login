<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
</head>
<body>
    <form id="loginForm">
        <div class="login-container">
            <h2>Đăng nhập vào MiniQuiz bằng MiniQuiz Login</h2>
            <input type="text" id="username" placeholder="Tên Đăng Nhập" required>
            <input type="password" id="password" placeholder="Mật khẩu" required>
            <h5 style="color: red;" id="error"></h5>
            <button type="submit">Đăng Nhập</button>
        </div>
    </form>

<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
}

.login-container, .register-container {
    background-color: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    width: 300px;
}

h2 {
    text-align: center;
}

input {
    width: 93%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #45a049;
}

a {
    color: #4CAF50;
    text-decoration: none;
}
</style>

<script>
    // Dữ liệu tài khoản mẫu
    const accounts = [
        { username: 'admin', password: '12345' },
        { username: 'user1', password: 'password1' },
        { username: 'user2', password: 'password2' }
    ];

    // Xử lý sự kiện đăng nhập
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        // Kiểm tra tài khoản đăng nhập
        const account = accounts.find(account => account.username === username && account.password === password);

        if (account) {
            // Đăng nhập thành công
            window.opener.postMessage('success', window.location.origin);
            window.close();
        } else {
            error.textContent = 'Thông tin đăng nhập không đúng!';
        }
    });

    // Xử lý sự kiện chuyển sang trang đăng ký
    document.getElementById('showRegister').addEventListener('click', function(event) {
        event.preventDefault();
        document.querySelector('.login-container').style.display = 'none';
        document.querySelector('.register-container').style.display = 'block';
    });

    // Xử lý sự kiện quay lại trang đăng nhập
    document.getElementById('showLogin').addEventListener('click', function(event) {
        event.preventDefault();
        document.querySelector('.login-container').style.display = 'block';
        document.querySelector('.register-container').style.display = 'none';
    });

    // Xử lý sự kiện đăng ký tài khoản
    document.getElementById('registerForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const newUsername = document.getElementById('newUsername').value;
        const newPassword = document.getElementById('newPassword').value;

        // Kiểm tra nếu tên tài khoản đã tồn tại
        const existingAccount = accounts.find(account => account.username === newUsername);

        if (existingAccount) {
            alert('Tài khoản đã tồn tại!');
        } else {
            // Thêm tài khoản mới vào mảng
            accounts.push({ username: newUsername, password: newPassword });
            alert('Đăng ký thành công!');
            document.querySelector('.login-container').style.display = 'block';
            document.querySelector('.register-container').style.display = 'none';
        }
    });
</script>

</body>
</html>
